name: Release

on:
  push:
    branches: 
      - master

permissions: 
  contents: write
  issues: write
  pull-requests: write

jobs:
  release_please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release_please.outputs.releases_created }}
      tag_name: ${{ steps.release_please.outputs.tag_name }}
    steps:
      - id: release_please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7

  release:
    needs: release_please
    if: needs.release_please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.release_please.outputs.tag_name }}

      - name: Setup pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.x

      - name: Install dependencies
        run: pnpm ci

      - name: Build UserScript
        run: pnpm run build

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ needs.release_please.outputs.tag_name }}
          fail_on_unmatched_files: true
          files: |
            ./dist/*.meta.js
            ./dist/*.user.js

      - name: Deliver webhook to Greasy Fork
        env:
          WEBHOOK_URL: ${{ secrets.GREASYFORK_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.GREASYFORK_WEBHOOK_SECERT }}
          RELEASE_TAG: ${{ needs.release_please.outputs.tag_name }}
          REPOSITORY_URL: ${{ github.event.repository.html_url }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CLONE_URL: ${{ github.event.repository.clone_url }}
        run: |
          set -euo pipefail

          payload=$(jq -n \
            --arg tag_name "$RELEASE_TAG" \
            --arg html_url "$REPOSITORY_URL" \
            --arg default_branch "$DEFAULT_BRANCH" \
            --arg clone_url "$CLONE_URL" \
            '{
              action: "published",
              release: {name: $tag_name, tag_name: $tag_name},
              repository: {
                html_url: $html_url,
                default_branch: $default_branch,
                clone_url: $clone_url
              }
            }')
          signature=$(printf '%s' "$payload" | openssl dgst -sha1 -hmac "$WEBHOOK_SECRET" | awk '{print $NF}')

          curl --silent --show-error --fail-with-body \
            --header 'Content-Type: application/json' \
            --header "X-Hub-Signature: sha1=$signature" \
            --header 'X-GitHub-Event: release' \
            --data-binary "$payload" \
            "$WEBHOOK_URL"
